<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chronology S — Calendars</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%23d1e7d1'/></svg>">
<link rel="stylesheet" href="cal/styles.css?cb=13">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="name">Chronology S</span>
    </div>
    <nav class="tabs">
      <a class="on" href="index.html">Timeline</a>
    </nav>
    <div class="spacer"></div>
    <span class="chip">dummy data</span>
    <button class="btn ghost" id="resetBtn" title="Restore the original dummy data">reset</button>
  </header>

  <div class="body">
    <!-- ============ region 2: calendar list (collapsible) ============ -->
    <aside class="side" id="sidePanel">
      <div class="dragbar" id="dragSide" title="Drag to resize"></div>
      <div id="calList"></div>

      <p class="label">View</p>
      <div style="font-size:13px;color:var(--muted);line-height:1.5">
        <div id="viewCount">—</div>
        <div id="viewRange" style="font-family:var(--mono);font-size:11px;margin-top:6px"></div>
      </div>
    </aside>
    <button class="rail" id="railSide" title="Calendars"><span class="rail-lab">Calendars</span><span class="rail-arrow">‹</span></button>

    <!-- ============ region 3: events panel (collapsible) ============ -->
    <section class="evpanel" id="evPanel">
      <div class="dragbar" id="dragEv" title="Drag to resize"></div>
      <div class="evpanel-head">
        <select class="select" id="evFilter" title="Filter by calendar">
          <option value="">All events</option>
        </select>
      </div>
      <div class="evpanel-body" id="evList"></div>
      <div class="evpanel-foot">
        <button class="btn primary" id="evAddBtn" style="width:100%">＋ Add event</button>
      </div>
    </section>
    <button class="rail" id="railEv" title="Events"><span class="rail-lab">Events</span><span class="rail-arrow">›</span></button>

    <!-- ============ region 4: right column ============ -->
    <main class="main">
      <!-- controls live OUTSIDE the table, in-flow, left/right split above it -->
      <div class="tl-controls">
        <div class="ctl-left">
          <select class="select ctl" id="zoomSel" title="Zoom — each preset puts that unit at 30px">
            <option value="fit">Fit all</option>
            <option value="millennia">30 px / millennium</option>
            <option value="centuries">30 px / century</option>
            <option value="decades">30 px / decade</option>
            <option value="years">30 px / year</option>
            <option value="months" selected>30 px / month</option>
            <option value="days">30 px / day</option>
          </select>
          <button class="btn icon" id="zin" title="Zoom in">＋</button>
          <button class="btn icon" id="zout" title="Zoom out">－</button>
          <span class="sep" style="width:1px;height:18px;background:var(--border)"></span>
          <button class="btn icon" id="left" title="Scroll calendars left">←</button>
          <button class="btn icon" id="right" title="Scroll calendars right">→</button>
          <span class="sep" style="width:1px;height:18px;background:var(--border)"></span>
          <button class="btn icon" id="up" title="Earlier">↑</button>
          <button class="btn icon" id="down" title="Later">↓</button>
        </div>
        <div class="ctl-right">
          <button class="btn sm" id="gearBtn" title="Global settings">⚙</button>
          <button class="btn sm" id="todayBtn">Today</button>
        </div>

        <!-- ⚙ global settings: timeline view variables -->
        <div class="panel" id="settingsPanel" hidden>
          <div class="panel-head">
            <span class="label">Global settings</span>
            <button class="btn ghost" id="settingsClose">✕</button>
          </div>
          <div class="panel-body" id="settingsBody"></div>
        </div>
      </div>

      <div class="tl-panel">
        <!-- row 1: coordinates -->
        <div class="tl-range"><span class="range" id="range">—</span></div>

        <!-- row 2: the timeline -->
        <div id="vt-scroll"><div id="vt-inner"></div></div>

        <!-- row 3: coordinates (one per calendar, aligned to the columns) -->
        <div class="legend" id="coordRow"></div>
      </div>
    </main>
  </div>
</div>

<div class="readout" id="readout"></div>

<!-- ============ calendar drawer ============ -->
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Calendar editor" style="display:none">
  <div class="drawer-head">
    <h2 id="drawerTitle">Calendar</h2>
    <button class="btn ghost" id="drawerClose" title="Close">✕</button>
  </div>
  <div class="drawer-body">
    <label class="fld"><span>Name</span>
      <input id="fName" type="text" placeholder="e.g. Proleptic Gregorian"></label>

    <div class="row2">
      <label class="fld"><span>Valid from — blank = unbounded</span>
        <span class="stack">
          <span class="inline">
            <input id="fBoundFromD" type="number" min="1" max="31" value="1">
            <select id="fBoundFromM"></select>
            <input id="fBoundFromY" type="number" value="1">
          </span>
          <small class="err" id="fBoundFromErr"></small>
        </span>
      </label>
      <label class="fld"><span>Valid to — blank = unbounded</span>
        <span class="stack">
          <span class="inline">
            <input id="fBoundToD" type="number" min="1" max="31" value="1">
            <select id="fBoundToM"></select>
            <input id="fBoundToY" type="number" value="1">
          </span>
          <small class="err" id="fBoundToErr"></small>
        </span>
      </label>
    </div>

    <div class="row2">
      <label class="fld"><span>Epoch — day 1/1/1 is this day</span>
        <span class="stack">
          <select id="fEpochCal"></select>
          <span class="inline">
            <input id="fEpochD" type="number" min="1" max="31" value="1">
            <select id="fEpochM"></select>
            <input id="fEpochY" type="number" value="1">
          </span>
          <small class="err" id="fEpochErr"></small>
        </span>
      </label>
      <label class="fld"><span>Year numbering</span>
        <select id="fEra">
          <option value="ce">Common Era (1, 2, 3 … no year zero)</option>
          <option value="astro">Astronomical (… −1, 0, 1 … year zero exists)</option>
        </select></label>
    </div>

    <div class="fld">
      <span>Months</span>
      <table class="months" id="monthTable">
        <thead><tr><th>#</th><th>Name</th><th>Days</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <div class="row">
        <button class="btn sm" id="addMonth">＋ month</button>
        <button class="btn sm" id="addLeapMonth">＋ leap month</button>
      </div>
      <small class="err" id="fMonthsErr"></small>
    </div>

    <div class="fld">
      <span>Leap rule</span>
      <div class="leapopts">
        <label class="radio"><input type="radio" name="leap" value="every4"> Every 4th year</label>
        <label class="radio"><input type="radio" name="leap" value="custom"> 4-year cycle, leap years</label>
        <label class="radio"><input type="radio" name="leap" value="none"> None (fixed year length)</label>
      </div>
      <div class="inline">
        <input id="fLeapCycle" type="number" min="4" value="30" title="cycle length in years">
        <input id="fLeapYears" type="text" value="2,3,5,7,10,13,16,18,21,24,26,29" title="leap years within the cycle">
      </div>
      <small class="muted" id="leapHint"></small>
    </div>

    <div class="fld">
      <span>Date format</span>
      <input id="fFmt" type="text" value="DD/MM/YYYY">
    </div>

    <div class="fld">
      <span>Colour</span>
      <input id="fColor" type="color" value="#4f7cdf">
    </div>

    <div class="fld">
      <span>Built-in preset <small class="muted">(replaces the rule fields)</small></span>
      <div class="row" id="presets"></div>
    </div>

    <div class="preview">
      <div class="preview-h">Preview — round trip</div>
      <div class="preview-g" id="previewG"></div>
      <small class="err" id="fErr"></small>
    </div>
  </div>
  <div class="drawer-foot">
    <button class="btn danger" id="delBtn" hidden>delete</button>
    <div class="spacer"></div>
    <button class="btn" id="cancelBtn">cancel</button>
    <button class="btn primary" id="saveBtn">save</button>
  </div>
</aside>

<script src="cal/engine.js?cb=20"></script>
<script src="cal/store.js?cb=20"></script>
<script src="cal/settings.js?cb=4"></script>
<script src="cal/settingspanel.js?cb=2"></script>
<script src="cal/timeline.js?cb=41"></script>
<script src="cal/eventeditor.js"></script>
<script src="cal/editor.js?cb=23"></script>
<script src="cal/panels.js?cb=20"></script>
<script src="cal/sidebar.js?cb=20"></script>
<script>
CalEditor.bind();
Settings.load();
window.SettingsPanel.bindGear();
/* shared event drawer (also used by the region-3 events panel) */
fetch('cal/event-drawer.html').then(r => r.text()).then(html => {
  document.body.insertAdjacentHTML('beforeend', html);
  window.EventEditor.bind();
});
</script>
</body>
</html>
